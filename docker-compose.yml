
services:
  user_service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/user_service/db.sqlite3:/app/db.sqlite3

  product_service:
    build:
      context: .
      dockerfile: services/product_service/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./services/product_service/db.sqlite3:/app/db.sqlite3


  order_service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./services/order_service/db.sqlite3:/app/db.sqlite3
    environment:
      PRODUCT_SERVICE_URL: "http://product_service:8002/api/products"
      INVENTORY_SERVICE_URL: "http://inventory_service:8004/api/inventory"
      PAYMENT_SERVICE_URL: "http://payment_service:8005/api/payments"


  inventory_service:
    build:
      context: .
      dockerfile: services/inventory_service/Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./services/inventory_service/db.sqlite3:/app/db.sqlite3

  payment_service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    ports:
      - "8005:8005"
    volumes:
      - ./services/payment_service/db.sqlite3:/app/db.sqlite3



